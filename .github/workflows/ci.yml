name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: nova-voice-id

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install "ruff==0.17.0"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: ShellCheck the s6 scripts
        run: |
          shellcheck \
            nova_voice_id/rootfs/etc/s6-overlay/s6-rc.d/nova-voice-id/run \
            nova_voice_id/rootfs/etc/s6-overlay/s6-rc.d/nova-voice-id/finish

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pip install --require-hashes -r requirements.txt
          pip install "pytest==9.1.1" "pytest-asyncio==1.4.0"

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: .models
          key: models-${{ hashFiles('nova_voice_id/models.txt') }}

      - name: Fetch models (SHA-256 checked)
        run: python scripts/fetch_models.py .models

      - name: Pytest
        env:
          NVID_REQUIRE_MODELS: "1"
        run: python -m pytest -v

  init:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  docker:
    name: Docker build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Read base image
        id: base
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "build_from=$(yq ".build_from.${ARCH}" nova_voice_id/build.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: .
          file: nova_voice_id/Dockerfile
          build-args: BUILD_FROM=${{ steps.base.outputs.build_from }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ci
          version: ci
          cosign: "false"
          push: "false"
          load: "true"

      - name: Smoke test the image
        env:
          IMAGE: ${{ matrix.image }}:ci
        run: |
          set -euo pipefail
          echo "Image size: $(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec)"

          # The proxy runs as the unprivileged user, with no upstream and no
          # Supervisor, and keeps its data in a folder that user owns.
          docker run -d --name smoke --entrypoint /bin/sh "$IMAGE" -c \
            'mkdir -p /tmp/data && chown nova /tmp/data && exec /command/s6-setuidgid nova \
             python3 -m nova_voice_id --upstream-uri tcp://127.0.0.1:1 --log-level info \
             --data-dir /tmp/data --no-supervisor'
          for _ in $(seq 1 60); do
            if docker exec smoke python3 -m nova_voice_id.health; then
              ok=1
              break
            fi
            sleep 1
          done
          logs="$(docker logs smoke 2>&1)"
          echo "$logs"
          [ "${ok:-0}" = 1 ] || { echo "describe did not answer"; exit 1; }
          [[ "$logs" == *"listening on tcp://"* ]]
          [[ "$logs" == *"Speaker model wespeaker_en_voxceleb_resnet34_LM, 0 voice profiles"* ]]
          # PID 1 is the proxy: sh and s6-setuidgid both exec into it.
          [ "$(docker exec smoke stat -c %U /proc/1)" = "nova" ]
          [ "$(docker exec smoke stat -c %a /tmp/data/token)" = "600" ]
          docker exec smoke python3 -c \
            "import importlib.metadata as m; assert m.version('wyoming') == '1.10.2'; \
             assert m.version('sherpa-onnx') == '1.13.8'"
          docker exec smoke test -f /usr/src/models/MODEL_LICENCES
          docker exec smoke test -f /etc/s6-overlay/user-bundles.d/user/contents.d/nova-voice-id
          docker exec smoke test ! -e /etc/s6-overlay/s6-rc.d/user

          echo "Embedding time for a 3 s clip on ${{ matrix.arch }}:"
          docker exec smoke python3 -m nova_voice_id.bench /usr/src/models
          docker rm -f smoke
